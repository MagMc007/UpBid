{% extends "auctions/layout.html" %}

{%block title %} {{ listing.title}} {% endblock %}

{% block body %}
<div class="detail-product-container">
    <div class="detail-image-container">
        <img src="{{ listing.image_url }}" alt="image for {{ listing.title }}">
    </div>
    <div class="detail-info-container">
        <div class="product-title">
            {{ listing.title }}
            <hr>
        </div>
        <div class="product-description">
            {{ listing.description }}
        </div>
        <div class="product-price">
            Leading Bid: ${{ listing.starting_bid }}
        </div>

        <div class="detail-tool-container">
            <div class="bid-on">
                <form action="" class="bidding-form" method="post">
                    {% csrf_token %}
                    <input type="number" class="form-control" name="bid" placeholder="Bid here...">
                    <button type="submit" class="btn btn-primary">Bid</button>
                </form>
            </div>
            <div class="watchlist">
                <form action="" method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary">Add to watchlist</button>
                </form>
            </div>
        </div>

        <div class="product-comments">
            <div class="create-comment">
                <form action="" method="post">
                    <textarea class="form-control" rows="3" cols="25" placeholder="Your comments . . ."></textarea>
                    <button type="submin" class="btn btn-primary">Comment</button>
                </form>
            </div>
            <div class="view-comments">
                No comments
            </div>
        </div>
    </div>
</div>
{% endblock %}
